name: PFU status check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Надіслати статус зараз"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pfu-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Check status
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TRACK_ID: ${{ secrets.TRACK_ID }}
          FORCE: ${{ inputs.force }}
        run: python check_once.py

      - name: Save state
        run: |
          git config user.name "pfu-bot"
          git config user.email "pfu-bot@users.noreply.github.com"
          [ -f state.json ] || exit 0
          git status --porcelain state.json | grep -q . || exit 0
          cp state.json /tmp/state.json
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.json state.json
            git add state.json
            git diff --cached --quiet && exit 0
            git commit -m "status update"
            git push && exit 0
            sleep 5
          done
          exit 1
